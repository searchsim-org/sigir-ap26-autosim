the way, where are they made?", "real_side": "B"}, {"id": "weight_25", "condition": "weight", "history": "", "a": "I'm looking for a new perfume. Can you?", "b": "I'm looking for a new perfume. Can you help me?", "real_side": "B"}, {"id": "default_23", "condition": "default", "history": "", "a": "Sure thing! The city bike is perfect for exploring a city without breaking a sweat. It’s designed to be lightweight, comfortable, and has smaller gears for navigating through the city streets. Plus, t", "b": "Interesting. Can you tell me more about the bike you suggested earlier to me?", "real_side": "B"}, {"id": "default_0", "condition": "default", "history": "", "a": "Thanks, I like the train option, do you have suggestions of potential destinations for me?", "b": "Sure! For eco-friendly destinations in Europe from London, you could consider places like Copenhagen in Denmark, Prague in the Czech Republic, or even Amsterdam in the Netherlands. They're all known f", "real_side": "A"}, {"id": "default_6", "condition": "default", "history": "", "a": "What are the common symptoms?", "b": "Sure! Here are some common symptoms of both grief and depression:", "real_side": "A"}, {"id": "default_26", "condition": "default", "history": "", "a": "Ok, interesting. How about the socials?", "b": "Sure thing! Social symptoms of depression can include withdrawing from social activities, losing interest in hobbies or things they used to enjoy, feeling lonely, and avoiding social situations.", "real_side": "A"}, {"id": "default_12", "condition": "default", "history": "", "a": "Hmm, no, alligator is too expensive. The other one you mentioned would interest me though. Is it included in the license? What about my father?", "b": "Nope, the alligator license doesn’t seem to be part of the regular hunting license. Wondering if the hog hunting license comes with a rifle hunting license too for my dad who’s retired from the Army? ", "real_side": "A"}, {"id": "default_2", "condition": "default", "history": "", "a": "Sure thing! When choosing indoor plants, think about the lighting conditions in your home—some thrive in direct sunlight, while others prefer shade. Consider your space too; smaller pots work well in ", "b": "Yes, can you give me some general advice on how to select a few new species?", "real_side": "B"}, {"id": "weight_4", "condition": "weight", "history": "", "a": "Can my dogs help me?", "b": "Can my dogs assist me too?", "real_side": "A"}, {"id": "weight_29", "condition": "weight", "history": "", "a": "Nice. How does the bigger one fare?", "b": "Nice. How does X1 compare to Porsche?", "real_side": "B"}, {"id": "weight_0", "condition": "weight", "history": "", "a": "Yes.", "b": "Yes, how does S22 Ultra fare against the others?", "real_side": "A"}, {"id": "weight_16", "condition": "weight", "history": "", "a": "I don't want to wait unnecessary time. In how many months can I start growing them if we are in December?", "b": "I don't want to wait unnecessary time.", "real_side": "B"}, {"id": "default_1", "condition": "default", "history": "", "a": "Thanks, I will have a look at the website later. I used to hunt lots of animals in my previous state, but I may want to change, how about other animals that could be interesting?", "b": "That sounds interesting! Besides deer, what other animals are commonly hunted in Florida? I'm curious about the options there.", "real_side": "A"}, {"id": "weight_15", "condition": "weight", "history": "", "a": "No, I will keep this in my cubby hole, my cat will not have access.", "b": "No, I will keep this in my cubbyhole, my cat will not have access.", "real_side": "A"}, {"id": "default_4", "condition": "default", "history": "", "a": "Sure! Different types of fragrance include floral, woody, fruity, oriental, and spicy. Each type has its unique scent profile. Do you have a preference for any of these?", "b": "I want to buy a fragrance. Can you tell me the different types?", "real_side": "B"}, {"id": "default_15", "condition": "default", "history": "", "a": "How far is the first hotel from the Egyptian Museum?", "b": "How far is the Nile Ritz-Carlton from the Egyptian Museum?", "real_side": "A"}, {"id": "default_25", "condition": "default", "history": "", "a": "Are there any vegetarian-friendly supplements or vitamins that could help with fatigue and lack of energy?", "b": "Lack of energy and feeling fatigue.", "real_side": "B"}, {"id": "default_22", "condition": "default", "history": "", "a": "Sure thing! There are a few Wildlife Management Areas in Florida that might be interesting. One of them is the Big Cypress National Preserve, which offers a variety of wildlife viewing and hiking oppo", "b": "Oh great, do you have some WMAs to suggest to us?", "real_side": "B"}, {"id": "weight_3", "condition": "weight", "history": "", "a": "No, I meant the other one.", "b": "No, I mean the circuit training workout.", "real_side": "B"}, {"id": "default_5", "condition": "default", "history": "", "a": "Sure thing! How about visiting some lesser-known spots like the Lake District in England or the coastal cities of Wales? They're scenic and less touristy. Alternatively, there's always Germany; perhap", "b": "I have already been to Amsterdam and Venice, and Barcelona is too hot for me.", "real_side": "B"}, {"id": "weight_28", "condition": "weight", "history": "", "a": "Are all of these types made with alcohol?", "b": "Are all of them made of alcohol?", "real_side": "B"}, {"id": "weight_24", "condition": "weight", "history": "", "a": "How their zinc content?", "b": "Of course in terms of zinc, I don't want to compare their taste!", "real_side": "B"}, {"id": "weight_6", "condition": "weight", "history": "", "a": "Can you compare the scent of the first two?", "b": "Can you also give me a comparison between the two? I like both floral and citrus scents.", "real_side": "A"}, {"id": "weight_23", "condition": "weight", "history": "", "a": "Tell me more about the last one, please... I am curious about the price too.", "b": "What are the benefits of installing them? I'm also curious about the price.", "real_side": "A"}, {"id": "default_10", "condition": "default", "history": "", "a": "If I were to fall in the bathroom, especially being at risk and living alone, what kind of safety measures could I put in place?", "b": "In case I still fall, what solutions exist?", "real_side": "B"}, {"id": "weight_8", "condition": "weight", "history": "", "a": "As if the world is an equal playing field, what about the poor?", "b": "As if the world is an equal playing field, what about those poorer nations?", "real_side": "A"}, {"id": "weight_2", "condition": "weight", "history": "", "a": "Thanks but what kind of beer?", "b": "Thanks, but you didn't mention any beer.", "real_side": "B"}, {"id": "weight_1", "condition": "weight", "history": "", "a": "How many bananas?", "b": "How many bananas contain the same content of magnesium?", "real_side": "B"}, {"id": "weight_5", "condition": "weight", "history": "", "a": "Ok, nice. Let's compare the hardware.", "b": "Ok, nice. Let's compare the hardware too.", "real_side": "A"}, {"id": "weight_14", "condition": "weight", "history": "", "a": "How far is it from there?", "b": "How far is the first hotel from the Egyptian Museum?", "real_side": "B"}, {"id": "default_11", "condition": "default", "history": "", "a": "Sure thing! How do dark and milk chocolates fare in terms of zinc content?", "b": "Of course in terms of zinc, I don't want to compare their taste!", "real_side": "B"}, {"id": "default_14", "condition": "default", "history": "", "a": "Using Greek yogurt instead of heavy cream does change the texture a bit, but the taste is pretty similar. It's a good swap for reducing fat and calories while still giving that creamy feel.", "b": "Using Greek yogurt instead of heavy cream sounds interesting. But won't it change the taste of the dish?", "real_side": "B"}];
let i=0, responses=[], t0=0, annot="";
const app=document.getElementById('app');
function consent(){
 app.innerHTML=`<h2>Which message was written by a real person?</h2>
 <p>In a web-search conversation, a user types short messages to a search assistant. On each screen you
 will see <b>two</b> candidate next messages for the same conversation. <b>One was written by an actual
 human user; the other by an AI simulator.</b> Your task: pick the one you think a real human wrote.</p>
 <p class="muted">There are ${PAIRS.length} screens, about 5-8 minutes. Answers are anonymous and used only
 to evaluate a research simulator. There are no risks; you may stop anytime by closing the tab.</p>
 <p>Optional participant code (e.g. Prolific ID): <input id="aid" style="padding:6px;border:1px solid #ccc;border-radius:6px"></p>
 <p><label><input type="checkbox" id="c"> I consent to take part.</label></p>
 <button class="nav" onclick="start()">Start</button>`;
}
function start(){ if(!document.getElementById('c').checked){alert('Please tick consent to start.');return;}
 annot=document.getElementById('aid').value.trim(); i=0; responses=[]; render(); }
function choose(side){
 const p=PAIRS[i]; responses.push({id:p.id,condition:p.condition,chosen:side,real_side:p.real_side,
  correct:(side===p.real_side),rt_ms:Math.round(performance.now()-t0)});
 i++; (i<PAIRS.length)?render():done();
}
function render(){ const p=PAIRS[i]; t0=performance.now();
 app.innerHTML=`<div class="muted">Screen ${i+1} of ${PAIRS.length}</div>
 <div class="bar"><div class="fill" style="width:${100*i/PAIRS.length}%"></div></div>
 <h2>Which message was written by a real human?</h2>
 ${p.history?`<div class="ctx"><b>Conversation so far:</b>\n${esc(p.history)}</div>`:''}
 <button class="opt" onclick="choose('A')"><b>A.</b> ${esc(p.a)}</button>
 <button class="opt" onclick="choose('B')"><b>B.</b> ${esc(p.b)}</button>
 <p class="muted">Pick the message that sounds like an actual person, not an AI.</p>`;
}
function done(){ const w=responses.filter(r=>r.condition==='weight'),d=responses.filter(r=>r.condition==='default');
 const acc=a=>a.length?(a.filter(r=>r.correct).length/a.length):0;
 const blob=new Blob([JSON.stringify({annot,ts:Date.now(),responses},null,1)],{type:'application/json'});
 const url=URL.createObjectURL(blob);
 app.innerHTML=`<h2>Thank you.</h2><p>You completed all ${responses.length} screens.</p>
 <p><a class="nav" style="text-decoration:none" href="${url}" download="human_study_${annot||'anon'}.json">Download my responses</a></p>
 <p class="muted">Please send the downloaded file to the researcher. (For your interest, your accuracy was
 ${(100*acc(w)).toFixed(0)}% on the test condition and ${(100*acc(d)).toFixed(0)}% on the control.)</p>`;
}
function esc(s){return (s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
consent();
</script></body></html>
